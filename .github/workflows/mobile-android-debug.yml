name: Build IDEAL FLOOR CRM Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-debug.yml"

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Normalize Expo dependencies
        run: npx expo install --fix

      - name: Test startup networking
        run: node --test tests/*.test.cjs

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Verify release compatibility settings
        run: |
          grep -qx 'android.enableMinifyInReleaseBuilds=false' android/gradle.properties
          grep -qx 'android.enableShrinkResourcesInReleaseBuilds=false' android/gradle.properties

      - name: Build standalone APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify embedded JavaScript and signing
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path('android/app/build/outputs/apk/release/app-release.apk')
          with ZipFile(apk) as archive:
              bundle = archive.getinfo('assets/index.android.bundle')
              assert bundle.file_size > 10000, 'Standalone JavaScript bundle is missing or empty'
          print('Standalone APK contains bundled application code')
          PYVERIFY
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify android/app/build/outputs/apk/release/app-release.apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Android 13 login startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          disable-animations: true
          working-directory: mobile
          script: bash scripts/check-startup.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Save startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-diagnostics
          path: mobile/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ideal-floor-crm-android-standalone
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
