name: Build IDEAL FLOOR CRM Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-debug.yml"

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Normalize Expo dependencies
        run: npx expo install --fix

      - name: Test startup networking
        run: node --test tests/*.test.cjs

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Strict TypeScript compilation
        run: npx tsc --noEmit

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Verify release compatibility settings
        run: |
          grep -qx 'android.enableMinifyInReleaseBuilds=true' android/gradle.properties
          grep -qx 'android.enableShrinkResourcesInReleaseBuilds=true' android/gradle.properties
          grep -q 'WorkManager/Room reflective initialization' android/app/proguard-rules.pro

      - name: Build standalone APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify embedded JavaScript and signing
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path('android/app/build/outputs/apk/release/app-release.apk')
          with ZipFile(apk) as archive:
              bundle = archive.getinfo('assets/index.android.bundle')
              assert bundle.file_size > 10000, 'Standalone JavaScript bundle is missing or empty'
          print('Standalone APK contains bundled application code')
          print(f"APK size: {apk.stat().st_size / (1024 * 1024):.1f} MiB")
          print(f"Native shrinking: enabled with Room/WorkManager keep rules")
          baseline = 101047362
          reduction = 100 * (baseline - apk.stat().st_size) / baseline
          print(f"Change vs Android 0.1.2: {reduction:+.1f}% smaller")
          diagnostics = Path("diagnostics")
          diagnostics.mkdir(exist_ok=True)
          with ZipFile(apk) as archive:
              top = sorted(archive.infolist(), key=lambda entry: entry.compress_size, reverse=True)[:25]
          lines = [
              f"APK bytes: {apk.stat().st_size}",
              f"Previous 0.1.2 APK bytes: {baseline}",
              f"Size difference: {baseline-apk.stat().st_size:+d} bytes",
              "Largest compressed APK entries:"
          ] + [f"{entry.compress_size:>12d} {entry.filename}" for entry in top]
          (diagnostics / "apk-size.txt").write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines[:4]))
          PYVERIFY
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify android/app/build/outputs/apk/release/app-release.apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Android 13 login startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          disable-animations: true
          working-directory: mobile
          script: bash scripts/check-startup.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Save startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-diagnostics
          path: mobile/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ideal-floor-crm-android-standalone
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
