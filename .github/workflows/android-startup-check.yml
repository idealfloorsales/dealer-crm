name: Check Android APK startup
on:
  workflow_dispatch:
  push:
    branches: [mobile-app]
    paths: ['.github/workflows/android-startup-check.yml']
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download installed standalone build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download 42826009919 --name ideal-floor-crm-android-standalone --dir package
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb install package/app-release.apk
            adb logcat -c
            adb shell am start -W -n kz.idealfloor.crm/.MainActivity || true
            sleep 25
            adb logcat -d -v brief AndroidRuntime:E ReactNativeJS:V ReactNative:V '*:S' | tee startup.log
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml startup-ui.xml || true
            adb exec-out screencap -p > startup.png
            adb shell pidof kz.idealfloor.crm
            grep -Eq 'Вход|Логин' startup-ui.xml
      - name: Save startup diagnostics from empty test device
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-diagnostics
          path: |
            startup.log
            startup-ui.xml
            startup.png
          retention-days: 7
