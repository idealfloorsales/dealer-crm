<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Коммерческое предложение IDEAL FLOOR</title>
<style>
:root{--red:#a7070d;--ink:#242529;--muted:#85888f;--line:#e1dedb;--bg:#f2f0ed;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}body.lightbox-open{overflow:hidden}.shell{width:min(1180px,calc(100% - 24px));margin:auto;padding:22px 0 50px}.brand{overflow:hidden;border-radius:22px;background:#8f0710;min-height:150px}.brand img{display:block;width:100%;height:auto}.brand-fallback{display:none;min-height:150px;align-items:center;padding:24px 34px;background:linear-gradient(120deg,#9e0710,#5e090d);color:#fff;font-size:2rem;font-weight:900;letter-spacing:.05em}.hero{margin-top:12px;padding:24px;border-radius:20px;background:linear-gradient(125deg,#171719,#541016);color:#fff}.hero small{font-size:.72rem;font-weight:800;letter-spacing:.12em;opacity:.6}.hero h1{margin:7px 0 4px;font-size:1.8rem}.hero p{margin:0;opacity:.72}.brand-copy{margin:12px 0 0;padding:17px 19px;border:1px solid var(--line);border-radius:16px;background:#fff;color:#4b4d52;font-size:.82rem;line-height:1.62}.brand-copy strong{color:#222428}.brand-copy:empty{display:none}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.meta>div{padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--card)}.meta small,.meta strong{display:block}.meta small{color:var(--muted);font-size:.68rem}.meta strong{margin-top:3px;font-size:.9rem}.discount{color:var(--red)}.offer-contact{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:12px 0 14px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:#fff}.offer-contact-copy small,.offer-contact-copy strong,.offer-contact-copy span{display:block}.offer-contact-copy small{color:var(--muted);font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.offer-contact-copy strong{margin-top:4px;font-size:1rem}.offer-contact-copy span{margin-top:3px;color:#74777d;font-size:.75rem}.offer-contact-actions{display:flex;gap:7px;flex-wrap:wrap}.offer-contact-actions a{min-height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;border:1px solid #dedad7;border-radius:10px;background:#fff;color:#303237;text-decoration:none;font-size:.74rem;font-weight:800}.offer-contact-actions .wa{border-color:#cce9da;background:#eff9f4;color:#237451}.collection{margin-top:14px}.collection-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:8px;padding:0 3px}.collection-head h2{margin:0;font-size:1.03rem}.collection-head span{color:var(--muted);font-size:.7rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff}.photo{height:180px;background:#eceae7;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:transform .2s ease}.photo:hover img{transform:scale(1.018)}.photo-open-hint{position:absolute;right:9px;bottom:9px;display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:9px;background:rgba(20,20,22,.72);color:#fff;font-size:.62rem;font-weight:700;pointer-events:none;backdrop-filter:blur(6px)}.fallback{display:none;width:100%;height:100%;place-items:center;color:#aaa;font-size:2rem}.copy{padding:12px}.sku{color:var(--red);font-size:.67rem;font-weight:800}.copy h3{margin:4px 0 2px;font-size:.95rem}.spec{color:var(--muted);font-size:.7rem}.stock{display:inline-flex;align-items:center;margin-top:8px;padding:5px 8px;border-radius:8px;background:#edf7f1;color:#256f51;font-size:.68rem;font-weight:800}.prices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.prices div{padding:8px;border-radius:9px;background:#f7f6f4}.prices small,.prices strong{display:block}.prices small{color:#92949a;font-size:.62rem}.prices strong{margin-top:2px;font-size:.86rem}.prices .final strong{color:var(--red)}.actions{position:sticky;bottom:10px;display:flex;justify-content:flex-end;gap:7px;margin-top:16px;padding:9px;border:1px solid rgba(0,0,0,.08);border-radius:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px)}.actions button,.actions a{min-height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0 13px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#333;text-decoration:none;font-weight:700;font-size:.78rem}.actions .wa{border-color:#18aa68;background:#18aa68;color:#fff}.foot{margin-top:14px;color:#8d8f94;text-align:center;font-size:.68rem}.error{margin-top:12px;padding:30px;border-radius:18px;background:#fff;text-align:center}.photo-lightbox{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(10,10,12,.94);backdrop-filter:blur(10px)}.photo-lightbox.is-open{display:flex}.photo-lightbox-stage{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%}.photo-lightbox img{display:block;max-width:min(96vw,1800px);max-height:90vh;object-fit:contain;border-radius:10px;box-shadow:0 24px 80px rgba(0,0,0,.45);touch-action:pinch-zoom}.photo-lightbox-close{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:2;width:46px;height:46px;border:1px solid rgba(255,255,255,.24);border-radius:14px;background:rgba(30,30,32,.72);color:#fff;font-size:1.4rem;cursor:pointer}.photo-lightbox-caption{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(90vw,900px);padding:8px 12px;border-radius:10px;background:rgba(20,20,22,.72);color:#fff;text-align:center;font-size:.75rem;line-height:1.35;backdrop-filter:blur(6px)}@media(max-width:800px){.meta{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.photo{height:150px}}@media(max-width:520px){.shell{width:calc(100% - 16px);padding-top:8px}.brand,.hero{border-radius:15px}.hero{padding:18px}.hero h1{font-size:1.35rem}.meta{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.photo{height:210px}.actions{bottom:6px}.actions>*{flex:1}.photo-lightbox{padding:8px}.photo-lightbox img{max-width:100%;max-height:88vh}.photo-lightbox-caption{font-size:.68rem}}@media print{body{background:#fff}.shell{width:100%;padding:0}.actions,.photo-lightbox,.photo-open-hint{display:none!important}.brand,.hero,.card,.meta>div{break-inside:avoid}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main class="shell">
<div class="brand"><img src="/ideal-floor-commercial-header.png.png" alt="IDEAL FLOOR" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="brand-fallback">IDEAL FLOOR</div></div>
<section class="hero"><small>IDEAL FLOOR · КОММЕРЧЕСКОЕ ПРЕДЛОЖЕНИЕ</small><h1 id="title">Загрузка…</h1><p id="subtitle"></p></section>
<div id="brand-copy" class="brand-copy"></div>
<div id="content"></div>
</main>
<div class="photo-lightbox" id="photo-lightbox" aria-hidden="true">
  <div class="photo-lightbox-stage">
    <button type="button" class="photo-lightbox-close" id="photo-lightbox-close" aria-label="Закрыть">×</button>
    <img id="photo-lightbox-image" alt="">
    <div class="photo-lightbox-caption" id="photo-lightbox-caption"></div>
  </div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
const money=v=>(Number(v)||0)>0?(Number(v)||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₸':'—';
const date=v=>v?new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const token=location.pathname.split('/').filter(Boolean).pop();
const thumb=(id,size=700)=>id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+size:'';
const phoneDigits=v=>{let d=String(v||'').replace(/\D/g,'');if(d.length===11&&d[0]==='8')d='7'+d.slice(1);if(d.length===10)d='7'+d;return d;};
const lightbox=document.getElementById('photo-lightbox'),lightboxImage=document.getElementById('photo-lightbox-image'),lightboxCaption=document.getElementById('photo-lightbox-caption');
function openPhoto(src,title){
 if(!src)return;
 lightboxImage.src=src;
 lightboxImage.alt=title||'Фото декора';
 lightboxCaption.textContent=title||'IDEAL FLOOR';
 lightbox.classList.add('is-open');
 lightbox.setAttribute('aria-hidden','false');
 document.body.classList.add('lightbox-open');
}
function closePhoto(){
 lightbox.classList.remove('is-open');
 lightbox.setAttribute('aria-hidden','true');
 document.body.classList.remove('lightbox-open');
 lightboxImage.removeAttribute('src');
}
document.getElementById('photo-lightbox-close').addEventListener('click',closePhoto);
lightbox.addEventListener('click',event=>{if(event.target===lightbox||event.target.classList.contains('photo-lightbox-stage'))closePhoto();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&lightbox.classList.contains('is-open'))closePhoto();});
document.addEventListener('click',event=>{
 const image=event.target.closest('[data-full-photo]');
 if(!image)return;
 openPhoto(image.dataset.fullPhoto||image.src,image.dataset.fullTitle||image.alt||'IDEAL FLOOR');
});
fetch('/api/public/offers/'+encodeURIComponent(token),{cache:'no-store'}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'КП недоступно');return d}).then(data=>{
 const s=data.snapshot||{},dealer=s.dealer||{},items=Array.isArray(s.items)?s.items:[],discount=Number(s.totalDiscountPercent)||0,list=s.priceList||{},showStock=Boolean(s.showStock),description=String(s.description||'').trim(),contact=s.contact||{};
 document.getElementById('title').textContent=data.offerNumber||'Коммерческое предложение';
 document.getElementById('subtitle').textContent=[dealer.name,dealer.city].filter(Boolean).join(' · ');
 document.getElementById('brand-copy').innerHTML=description?rich(description):'';
 const groups={};items.forEach(item=>{const key=item.collection||'IDEAL FLOOR';(groups[key]||(groups[key]=[])).push(item)});
 const contactPhone=phoneDigits(contact.phone),contactDetails=[contact.position,contact.phone].filter(Boolean).join(' · '),contactActions=contactPhone?'<div class="offer-contact-actions"><a href="tel:+'+contactPhone+'">Позвонить</a><a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+contactPhone+'">WhatsApp</a></div>':'',contactHtml=(contact.fullName||contact.phone)?'<section class="offer-contact"><div class="offer-contact-copy"><small>Контакт для обратной связи</small><strong>'+esc(contact.fullName||'IDEAL FLOOR')+'</strong><span>'+esc(contactDetails||'Свяжитесь с нами по вопросам предложения')+'</span></div>'+contactActions+'</section>':'';
 const cards=Object.keys(groups).map(name=>'<section class="collection"><div class="collection-head"><h2>'+esc(name)+'</h2><span>'+groups[name].length+' '+(groups[name].some(item=>item.productType==='equipment')?'позиций':'декоров')+'</span></div><div class="grid">'+groups[name].map(item=>{const ch=item.characteristics||{},spec=item.productType==='equipment'?'Торговое оборудование':[ch.class,ch.thickness?ch.thickness+' мм':'',ch.bevel,ch.size].filter(Boolean).join(' · '),src=thumb(item.photoId,700),fullSrc=thumb(item.photoId,2200),photoTitle=[item.sku,item.name].filter(Boolean).join(' · '),stock=showStock?'<div class="stock">Остаток: '+(Number(item.stockQty)||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' '+esc(item.stockUnit||(item.productType==='equipment'?'шт':'м²'))+'</div>':'';return '<article class="card"><div class="photo">'+(src?'<img src="'+esc(src)+'" data-full-photo="'+esc(fullSrc)+'" data-full-title="'+esc(photoTitle)+'" alt="'+esc(item.name)+'" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\';this.parentElement.querySelector(\'.photo-open-hint\')?.remove()"><span class="fallback">▧</span><span class="photo-open-hint">⛶ На весь экран</span>':'<span class="fallback" style="display:grid">▧</span>')+'</div><div class="copy"><div class="sku">'+esc(item.sku||'')+'</div><h3>'+esc(item.name||'')+'</h3><div class="spec">'+esc(spec||'IDEAL FLOOR')+'</div>'+stock+'<div class="prices"><div class="final"><small>Цена по КП</small><strong>'+money(item.finalPrice||item.basePrice)+'</strong></div><div><small>РРЦ</small><strong>'+money(item.rrp)+'</strong></div></div></div></article>'}).join('')+'</div></section>').join('');
 document.getElementById('content').innerHTML='<div class="meta"><div><small>Получатель</small><strong>'+esc(dealer.name||data.dealerName||'')+'</strong></div><div><small>Прайс</small><strong>'+esc(list.name||s.priceType?.label||'Спец.цена')+'</strong></div><div><small>Декоров</small><strong>'+items.length+'</strong></div><div><small>Действует до</small><strong>'+esc(date(data.expiresAt))+'</strong></div></div>'+contactHtml+cards+'<div class="actions"><button onclick="window.print()">Печать / PDF</button><button id="copy">Скопировать ссылку</button><a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('Коммерческое предложение IDEAL FLOOR: '+location.href)+'">WhatsApp</a></div><div class="foot">Персональное коммерческое предложение IDEAL FLOOR · цены и указанные остатки зафиксированы на момент создания.</div>';
 document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('copy').textContent='Скопировано'}catch(e){prompt('Скопируйте ссылку:',location.href)}};
}).catch(error=>{document.getElementById('title').textContent='КП недоступно';document.getElementById('content').innerHTML='<div class="error"><strong>Коммерческое предложение недоступно</strong><p>'+esc(error.message)+'</p></div>'});
</script>
</body></html>
