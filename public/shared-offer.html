<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Коммерческое предложение IDEAL FLOOR</title>
<style>
:root{--red:#a7070d;--ink:#242529;--muted:#85888f;--line:#e1dedb;--bg:#f2f0ed;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}.shell{width:min(1180px,calc(100% - 24px));margin:auto;padding:22px 0 50px}.brand{overflow:hidden;border-radius:22px;background:#fff}.brand img{display:block;width:100%;height:auto}.hero{margin-top:12px;padding:24px;border-radius:20px;background:linear-gradient(125deg,#171719,#541016);color:#fff}.hero small{font-size:.72rem;font-weight:800;letter-spacing:.12em;opacity:.6}.hero h1{margin:7px 0 4px;font-size:1.8rem}.hero p{margin:0;opacity:.72}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.meta>div{padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--card)}.meta small,.meta strong{display:block}.meta small{color:var(--muted);font-size:.68rem}.meta strong{margin-top:3px;font-size:.9rem}.discount{color:var(--red)}.collection{margin-top:14px}.collection-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:8px;padding:0 3px}.collection-head h2{margin:0;font-size:1.03rem}.collection-head span{color:var(--muted);font-size:.7rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff}.photo{height:180px;background:#eceae7;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.fallback{display:none;width:100%;height:100%;place-items:center;color:#aaa;font-size:2rem}.copy{padding:12px}.sku{color:var(--red);font-size:.67rem;font-weight:800}.copy h3{margin:4px 0 2px;font-size:.95rem}.spec{color:var(--muted);font-size:.7rem}.prices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.prices div{padding:8px;border-radius:9px;background:#f7f6f4}.prices small,.prices strong{display:block}.prices small{color:#92949a;font-size:.62rem}.prices strong{margin-top:2px;font-size:.86rem}.prices .final strong{color:var(--red)}.actions{position:sticky;bottom:10px;display:flex;justify-content:flex-end;gap:7px;margin-top:16px;padding:9px;border:1px solid rgba(0,0,0,.08);border-radius:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px)}.actions button,.actions a{min-height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0 13px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#333;text-decoration:none;font-weight:700;font-size:.78rem}.actions .wa{border-color:#18aa68;background:#18aa68;color:#fff}.foot{margin-top:14px;color:#8d8f94;text-align:center;font-size:.68rem}.error{margin-top:12px;padding:30px;border-radius:18px;background:#fff;text-align:center}@media(max-width:800px){.meta{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.photo{height:150px}}@media(max-width:520px){.shell{width:calc(100% - 16px);padding-top:8px}.brand,.hero{border-radius:15px}.hero{padding:18px}.hero h1{font-size:1.35rem}.meta{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.photo{height:210px}.actions{bottom:6px}.actions>*{flex:1}}@media print{body{background:#fff}.shell{width:100%;padding:0}.actions{display:none}.brand,.hero,.card,.meta>div{break-inside:avoid}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main class="shell">
<div class="brand"><img src="/price-header.jpg" alt="IDEAL FLOOR"></div>
<section class="hero"><small>IDEAL FLOOR · КОММЕРЧЕСКОЕ ПРЕДЛОЖЕНИЕ</small><h1 id="title">Загрузка…</h1><p id="subtitle"></p></section>
<div id="content"></div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>(Number(v)||0)>0?(Number(v)||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₸':'—';
const date=v=>v?new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const token=location.pathname.split('/').filter(Boolean).pop();
const thumb=id=>id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w700':'';
fetch('/api/public/offers/'+encodeURIComponent(token),{cache:'no-store'}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'КП недоступно');return d}).then(data=>{
 const s=data.snapshot||{},dealer=s.dealer||{},items=Array.isArray(s.items)?s.items:[],discount=Number(s.totalDiscountPercent)||0,list=s.priceList||{};
 document.getElementById('title').textContent=data.offerNumber||'Коммерческое предложение';
 document.getElementById('subtitle').textContent=[dealer.name,dealer.city,dealer.dealer_id].filter(Boolean).join(' · ');
 const groups={};items.forEach(item=>{const key=item.collection||'IDEAL FLOOR';(groups[key]||(groups[key]=[])).push(item)});
 const cards=Object.keys(groups).map(name=>'<section class="collection"><div class="collection-head"><h2>'+esc(name)+'</h2><span>'+groups[name].length+' декоров</span></div><div class="grid">'+groups[name].map(item=>{const ch=item.characteristics||{},spec=[ch.class,ch.thickness?ch.thickness+' мм':'',ch.bevel,ch.size].filter(Boolean).join(' · '),src=thumb(item.photoId);return '<article class="card"><div class="photo">'+(src?'<img src="'+esc(src)+'" alt="'+esc(item.name)+'" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><span class="fallback">▧</span>':'<span class="fallback" style="display:grid">▧</span>')+'</div><div class="copy"><div class="sku">'+esc(item.sku||'')+'</div><h3>'+esc(item.name||'')+'</h3><div class="spec">'+esc(spec||'IDEAL FLOOR')+'</div><div class="prices"><div class="final"><small>Цена по КП</small><strong>'+money(item.finalPrice||item.basePrice)+'</strong></div><div><small>РРЦ</small><strong>'+money(item.rrp)+'</strong></div></div></div></article>'}).join('')+'</div></section>').join('');
 document.getElementById('content').innerHTML='<div class="meta"><div><small>Дилер</small><strong>'+esc(dealer.name||data.dealerName||'')+'</strong></div><div><small>Прайс</small><strong>'+esc(list.name||s.priceType?.label||'Спец.цена')+'</strong></div><div><small>Скидка</small><strong class="discount">'+(discount?'−'+discount.toLocaleString('ru-RU',{maximumFractionDigits:2})+'%':'0%')+'</strong></div><div><small>Действует до</small><strong>'+esc(date(data.expiresAt))+'</strong></div></div>'+cards+'<div class="actions"><button onclick="window.print()">Печать / PDF</button><button id="copy">Скопировать ссылку</button><a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('Коммерческое предложение IDEAL FLOOR: '+location.href)+'">WhatsApp</a></div><div class="foot">Персональное коммерческое предложение IDEAL FLOOR · цены зафиксированы на момент создания.</div>';
 document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('copy').textContent='Скопировано'}catch(e){prompt('Скопируйте ссылку:',location.href)}};
}).catch(error=>{document.getElementById('title').textContent='КП недоступно';document.getElementById('content').innerHTML='<div class="error"><strong>Коммерческое предложение недоступно</strong><p>'+esc(error.message)+'</p></div>'});
</script>
</body></html>
