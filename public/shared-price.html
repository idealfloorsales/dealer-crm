<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Прайс IDEAL FLOOR</title><style>
:root{--red:#a7070d;--ink:#232428;--muted:#85888f;--line:#e7e3df;--bg:#f4f2ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}.shell{width:min(1120px,calc(100% - 24px));margin:auto;padding:24px 0 50px}.brand-header{overflow:hidden;margin-bottom:12px;border-radius:22px;background:#8f0710;min-height:150px}.brand-header img{display:block;width:100%;height:auto}.brand-fallback{display:none;min-height:150px;align-items:center;padding:24px 34px;background:linear-gradient(120deg,#9e0710,#5e090d);color:#fff;font-size:2rem;font-weight:900;letter-spacing:.05em}.hero{padding:20px 24px;border-radius:18px;background:linear-gradient(120deg,#151517,#4a1115);color:#fff}.hero small{opacity:.6;font-weight:800;letter-spacing:.12em}.hero h1{margin:6px 0 4px;font-size:1.7rem}.hero p{margin:0;opacity:.75}.meta,.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.meta>div,.summary>div{padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff}.meta small,.summary small{display:block;color:var(--muted);font-size:.72rem}.meta strong,.summary strong{display:block;margin-top:3px}.discount{color:var(--red)}.table{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff}.row{display:grid;grid-template-columns:minmax(180px,1.4fr) repeat(4,minmax(120px,.7fr));border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row>div{padding:12px}.head{background:#f8f7f5;color:#777;font-size:.72rem;font-weight:800}.row strong{display:block}.row small{display:block;color:var(--muted);margin-top:2px}.final strong{color:var(--red)}.foot{margin-top:12px;color:#888;font-size:.72rem;text-align:center}.error{padding:30px;border-radius:18px;background:#fff;text-align:center}@media(max-width:760px){.meta,.summary{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.head{display:none}.row>div:first-child{grid-column:1/-1;background:#faf9f7}.row>div::before{content:attr(data-label);display:block;color:#999;font-size:.65rem;margin-bottom:3px}}
</style></head><body><main class="shell"><div class="brand-header"><img src="/ideal-floor-commercial-header.png.png" alt="IDEAL FLOOR" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="brand-fallback">IDEAL FLOOR</div></div><section class="hero"><small>IDEAL FLOOR · ПЕРСОНАЛЬНЫЙ ПРАЙС</small><h1 id="title">Загрузка…</h1><p id="subtitle"></p></section><section id="content"></section></main><script>
const token=location.pathname.split('/').filter(Boolean).pop(),money=v=>(Number(v)||0)>0?(Number(v)||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₸':'—',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/public/price-share/'+encodeURIComponent(token),{cache:'no-store'}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ссылка недоступна');return d}).then(data=>{const s=data.snapshot||{},dealer=s.dealer||data.dealer||{},list=s.priceList||{},rows=Array.isArray(s.rows)?s.rows:[],discount=Number(s.totalDiscountPercent)||0,created=data.createdAt?new Date(data.createdAt).toLocaleString('ru-RU'):'',expires=data.expiresAt?new Date(data.expiresAt).toLocaleString('ru-RU'):'';document.getElementById('title').textContent=dealer.name||'Прайс';document.getElementById('subtitle').textContent=[dealer.city,dealer.dealer_id].filter(Boolean).join(' · ');const discountBlock=discount>0?'<div><small>Активная скидка IDEAL FLOOR</small><strong class="discount">−'+discount.toLocaleString('ru-RU',{maximumFractionDigits:2})+'%</strong></div>':'';document.getElementById('content').innerHTML='<div class="meta"><div><small>Прайс</small><strong>'+esc(list.name||'Спец.цена')+'</strong></div><div><small>Сформирован</small><strong>'+esc(created)+'</strong></div><div><small>Ссылка действует до</small><strong>'+esc(expires)+'</strong></div></div><div class="summary">'+discountBlock+'<div><small>Дилер</small><strong>'+esc(dealer.name||'')+'</strong></div><div><small>ID</small><strong>'+esc(dealer.dealer_id||'')+'</strong></div></div><div class="table"><div class="row head"><div>Коллекция</div><div>Оптовая цена</div><div>Итоговая оптовая</div><div>РРЦ</div><div>Цена на витрине</div></div>'+rows.map(r=>'<div class="row"><div><strong>'+esc(r.collection||r.name||'')+'</strong><small>'+esc((r.members||1)+' поз.')+'</small></div><div data-label="Оптовая цена"><strong>'+money(r.basePrice||r.opt)+'</strong></div><div class="final" data-label="Итоговая оптовая"><strong>'+money(r.finalPrice)+'</strong></div><div data-label="РРЦ"><strong>'+money(r.rrp)+'</strong></div><div data-label="Цена на витрине"><strong>'+money(r.displayPrice)+'</strong></div></div>').join('')+'</div><div class="foot">Персональный прайс IDEAL FLOOR. Ссылка предназначена для указанного дилера.</div>'}).catch(e=>{document.getElementById('content').innerHTML='<div class="error"><strong>Прайс недоступен</strong><p>'+esc(e.message)+'</p></div>';document.getElementById('title').textContent='Ссылка недоступна'});
</script></body></html>
