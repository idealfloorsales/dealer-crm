<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статьи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="style.css?v={{VER}}">
    <link rel="icon" href="favicon.gif" type="image/gif">
<link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#b9040a">
</head>
<body class="app-workspace-page knowledge-page">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4"></nav>
    <main class="container-fluid app-page-shell">
        <section class="app-page-hero">
            <div class="app-page-hero-copy">
                <div class="app-page-eyebrow">IDEAL FLOOR CRM · БАЗА ЗНАНИЙ</div>
                <h1>Статьи</h1>
                <p>Инструкции, памятки и рабочие материалы команды.</p>
            </div>
            <div class="app-page-actions">
                <button id="open-add-article-btn" class="app-hero-primary"><i class="bi bi-plus-lg"></i><span>Добавить статью</span></button>
            </div>
        </section>
        <div class="app-toolbar-card"><div class="app-search-field"><i class="bi bi-search"></i><input type="text" id="search-bar" class="form-control" placeholder="Поиск по базе знаний..."></div></div>
        <div class="accordion" id="article-list"></div>
        <p id="no-data-msg" class="alert alert-info mt-3" style="display: none;"></p>
    </main>
    
    <div class="modal fade" id="article-modal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="article-modal-title">Добавить статью</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="article-form">
                        <input type="hidden" id="article_id">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Название</label>
                            <input type="text" id="article_title" class="form-control" required placeholder="Название статьи">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Содержание</label>
                            <textarea id="article_content" class="form-control" rows="12" required placeholder="Текст статьи, инструкция или памятка"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light border rounded-pill px-4" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" form="article-form" class="btn btn-primary rounded-pill px-4">Сохранить</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="permissions.js?v={{VER}}"></script>
    <script src="knowledge.js?v={{VER}}"></script>
</body>
</html>
