<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram дилеров — IDEAL FLOOR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css?v={{VER}}">
<script src="theme-init.js?v={{VER}}"></script>
<link id="crm-dark-theme-file" rel="stylesheet" href="dark-theme.css?v={{VER}}" media="screen">
</head><body class="app-workspace-page">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4"></nav>
<main class="container-fluid app-page-shell">
<header class="app-page-hero"><h1>Instagram дилеров</h1></header>
<section class="app-toolbar-card p-3 mb-3 d-flex flex-wrap gap-3" aria-label="Фильтры">
<label>Месяц<input class="form-control" type="month" id="month"></label>
<label>Сектор<select class="form-select" id="sector"></select></label>
<label>Город<select class="form-select" id="city"></select></label>
<label>Менеджер<select class="form-select" id="manager"></select></label>
<label>Дилер<select class="form-select" id="dealer"></select></label>
<label>Коллекция<select class="form-select" id="collection"></select></label>
<label>Показать<select class="form-select" id="focus"><option value="">Все результаты</option><option value="silent">Есть образцы, без постов о них</option><option value="near">До 8 дней остался один</option><option value="rising">Выросла доля постов о конкурентах</option></select></label>
</section>
<section class="content-card p-3"><p id="status" role="status"></p><div id="results"></div></section>
<details id="import-box" class="content-card p-3 mt-3" hidden><summary>Импорт продаж по артикулам</summary>
<p class="mt-2">CSV в UTF-8 с разделителем «;». Одна строка — итог по дилеру и артикулу за дату. Повторная загрузка обновляет этот итог.</p>
<pre>Дата;Дилер;Артикул;м²
2026-11-05;IF001;8EH34-721;12,6</pre>
<input type="file" id="file" accept=".csv"><button class="btn btn-outline-secondary" id="import">Загрузить</button>
<span role="status" id="import-status"></span></details>
</main><script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="permissions.js?v={{VER}}"></script><script defer src="instagram-report.js?v={{VER}}"></script>
</body></html>
