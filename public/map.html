<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта покрытия</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <link rel="stylesheet" href="style.css?v={{VER}}"> <link rel="icon" href="favicon.gif" type="image/gif">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#b9040a">
    
    <style>
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; padding-bottom: 60px; } /* Место под меню */
        .map-wrapper { flex: 1; position: relative; width: 100%; height: 100%; display: flex; }
        #main-map { flex-grow: 1; height: 100%; z-index: 1; }

        /* Нижнее меню */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-top: 1px solid #eee;
            z-index: 2000;
            height: 60px;
            display: flex; justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .bottom-nav-item {
            text-align: center; color: #adb5bd; padding: 10px 0;
            text-decoration: none; flex: 1; transition: color 0.2s;
        }
        .bottom-nav-item.active { color: #B9040A; }
        .bottom-nav-item i { font-size: 1.4rem; display: block; margin-bottom: 2px; }
        .bottom-nav-item span { font-size: 0.65rem; font-weight: 600; }
        
        .desktop-nav { display: flex; }
        @media (max-width: 991px) {
            .desktop-nav { display: none !important; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm desktop-nav" style="flex-shrink: 0; z-index: 2000;">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><img src="logo.png" alt="Logo" height="30"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Дилеры</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/map.html">Карта</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products.html">Матрица</a></li>
                    <li class="nav-item"><a class="nav-link" href="/report.html">Выставленность</a></li>
                    <li class="nav-item"><a class="nav-link" href="/sales.html">Продажи</a></li>
                    <li class="nav-item"><a class="nav-link" href="/competitors.html">Конкуренты</a></li>
                    <li class="nav-item"><a class="nav-link" href="/knowledge.html">Статьи</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="map-wrapper" id="map-container-fullscreen">
        
        <div class="map-sidebar shadow-lg" id="map-sidebar">
            <div class="sidebar-header p-3 bg-white border-bottom">
                <div class="input-group shadow-sm mb-2">
                    <span class="input-group-text bg-white border-0 ps-3"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="map-search" class="form-control border-0" placeholder="Поиск..." style="height: 44px;">
                </div>
                <div id="map-search-suggestions" class="address-suggestions shadow-sm rounded-3 mt-1"></div>

                <div class="d-flex gap-2">
                    <select id="map-filter-city" class="form-select form-select-sm border-0 bg-light"><option value="">Все города</option></select>
                    <select id="map-filter-status" class="form-select form-select-sm border-0 bg-light">
                        <option value="">Все статусы</option>
                        <option value="active">🟢 Активный</option>
                        <option value="standard">🟡 Стандарт</option>
                        <option value="problem">🔴 Проблемный</option>
                        <option value="potential">🔵 Потенциальный</option>
                        <option value="archive">⚫ Архив</option>
                    </select>
                </div>
            </div>

            <div class="sidebar-content" id="dealer-list-container">
                <p class="text-center text-muted mt-4 small">Загрузка списка...</p>
            </div>
            
            <button id="btn-toggle-sidebar" class="btn btn-primary w-100 rounded-0 d-md-none py-3">Показать карту</button>
        </div>

        <div class="map-actions-right">
             <button id="btn-toggle-heat" class="btn-circle-map shadow mb-2" title="Тепловая карта"><i class="bi bi-layers-fill"></i></button>
             <button id="btn-fullscreen" class="btn-circle-map shadow mb-2" title="На весь экран"><i class="bi bi-arrows-fullscreen"></i></button>
             <button id="btn-my-location" class="btn-circle-map shadow" title="Сортировать по расстоянию"><i class="bi bi-geo-alt-fill"></i></button>
        </div>

        <div id="map-visible-count" class="map-counter-pill shadow-sm">
            Загрузка...
        </div>

        <button id="btn-show-list-mobile" class="btn btn-primary rounded-pill shadow px-4 py-2 mobile-list-toggle d-md-none">
            <i class="bi bi-list-ul me-2"></i>Список
        </button>
        
        <div id="main-map"></div>
    </div>

    <div class="bottom-nav d-flex justify-content-around d-lg-none">
        <a href="/" class="bottom-nav-item">
            <i class="bi bi-shop"></i><span>Дилеры</span>
        </a>
        <a href="/map.html" class="bottom-nav-item active">
            <i class="bi bi-geo-alt"></i><span>Карта</span>
        </a>
        <a href="/sales.html" class="bottom-nav-item">
            <i class="bi bi-graph-up-arrow"></i><span>Продажи</span>
        </a>
        <a href="/competitors.html" class="bottom-nav-item">
            <i class="bi bi-globe"></i><span>Бренды</span>
        </a>
        <a href="/report.html" class="bottom-nav-item">
            <i class="bi bi-pie-chart"></i><span>Отчет</span>
        </a>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="map.js?v={{VER}}"></script>     <script src="permissions.js?v={{VER}}"></script>
</body>
</html>
